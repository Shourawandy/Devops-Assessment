version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: devops-assessment-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: db.internal.local
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: devops-assessment-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
