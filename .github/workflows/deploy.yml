name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 672729160447

  BACKEND_REPOSITORY: devops-assessment-backend
  FRONTEND_REPOSITORY: devops-assessment-frontend

  EKS_CLUSTER_NAME: devops-assessment-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Build Backend
      ####################################################

      - name: Build Backend Image
        run: |
          docker build \
            -t $BACKEND_REPOSITORY:${{ github.sha }} \
            ./backend

      - name: Tag Backend Image
        run: |
          docker tag \
          $BACKEND_REPOSITORY:${{ github.sha }} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY:${{ github.sha }}

      - name: Push Backend Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY:${{ github.sha }}

      ####################################################
      # Build Frontend
      ####################################################

      - name: Build Frontend Image
        run: |
          docker build \
            -t $FRONTEND_REPOSITORY:${{ github.sha }} \
            ./frontend

      - name: Tag Frontend Image
        run: |
          docker tag \
          $FRONTEND_REPOSITORY:${{ github.sha }} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY:${{ github.sha }}

      - name: Push Frontend Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY:${{ github.sha }}

      ####################################################
      # Replace Image Tags
      ####################################################

      - name: Update Backend Image
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/backend-deployment.yaml

      - name: Update Frontend Image
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/frontend-deployment.yaml

      ####################################################
      # Configure kubectl
      ####################################################

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      ####################################################
      # Deploy
      ####################################################

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

      ####################################################
      # Verify
      ####################################################

      - name: Check Deployments
        run: |
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend
