name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #################################################
      # Build Backend
      #################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t $ECR_REGISTRY/devops-assessment-backend:${{ github.sha }} \
            ./backend

      - name: Push Backend Docker Image
        run: |
          docker push \
            $ECR_REGISTRY/devops-assessment-backend:${{ github.sha }}

      #################################################
      # Build Frontend
      #################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t $ECR_REGISTRY/devops-assessment-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push \
            $ECR_REGISTRY/devops-assessment-frontend:${{ github.sha }}

      #################################################
      # Configure kubectl
      #################################################

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      #################################################
      # Replace Image Tags
      #################################################

      - name: Replace Backend Image Tag
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/backend-deployment.yaml

      - name: Replace Frontend Image Tag
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/frontend-deployment.yaml

      #################################################
      # Deploy
      #################################################

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/

      #################################################
      # Verify
      #################################################

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/backend

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend

      - name: Show Resources
        run: |
          kubectl get pods
          kubectl get svc
          kubectl get ingress
